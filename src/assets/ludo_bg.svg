<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <pattern id="ludoTile" width="200" height="200" patternUnits="userSpaceOnUse" patternTransform="rotate(45 100 100)">
      <!-- Board Outer Frame -->
      <rect x="15" y="15" width="170" height="170" rx="8" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2" />
      
      <!-- 4 Corner Bases -->
      <!-- Red (Top-Left) -->
      <rect x="20" y="20" width="60" height="60" rx="4" fill="rgba(239, 68, 68, 0.14)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <rect x="28" y="28" width="44" height="44" rx="3" fill="rgba(255,255,255,0.06)" />
      <circle cx="38" cy="38" r="4.5" fill="rgba(239, 68, 68, 0.28)" />
      <circle cx="62" cy="38" r="4.5" fill="rgba(239, 68, 68, 0.28)" />
      <circle cx="38" cy="62" r="4.5" fill="rgba(239, 68, 68, 0.28)" />
      <circle cx="62" cy="62" r="4.5" fill="rgba(239, 68, 68, 0.28)" />

      <!-- Green (Top-Right) -->
      <rect x="120" y="20" width="60" height="60" rx="4" fill="rgba(16, 185, 129, 0.14)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <rect x="128" y="28" width="44" height="44" rx="3" fill="rgba(255,255,255,0.06)" />
      <circle cx="138" cy="38" r="4.5" fill="rgba(16, 185, 129, 0.28)" />
      <circle cx="162" cy="38" r="4.5" fill="rgba(16, 185, 129, 0.28)" />
      <circle cx="138" cy="62" r="4.5" fill="rgba(16, 185, 129, 0.28)" />
      <circle cx="162" cy="62" r="4.5" fill="rgba(16, 185, 129, 0.28)" />

      <!-- Blue (Bottom-Left) -->
      <rect x="20" y="120" width="60" height="60" rx="4" fill="rgba(37, 99, 235, 0.16)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <rect x="28" y="128" width="44" height="44" rx="3" fill="rgba(255,255,255,0.06)" />
      <circle cx="38" cy="138" r="4.5" fill="rgba(37, 99, 235, 0.32)" />
      <circle cx="62" cy="138" r="4.5" fill="rgba(37, 99, 235, 0.32)" />
      <circle cx="38" cy="162" r="4.5" fill="rgba(37, 99, 235, 0.32)" />
      <circle cx="62" cy="162" r="4.5" fill="rgba(37, 99, 235, 0.32)" />

      <!-- Yellow (Bottom-Right) -->
      <rect x="120" y="120" width="60" height="60" rx="4" fill="rgba(234, 179, 8, 0.14)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2" />
      <rect x="128" y="128" width="44" height="44" rx="3" fill="rgba(255,255,255,0.06)" />
      <circle cx="138" cy="138" r="4.5" fill="rgba(234, 179, 8, 0.28)" />
      <circle cx="162" cy="138" r="4.5" fill="rgba(234, 179, 8, 0.28)" />
      <circle cx="138" cy="162" r="4.5" fill="rgba(234, 179, 8, 0.28)" />
      <circle cx="162" cy="162" r="4.5" fill="rgba(234, 179, 8, 0.28)" />

      <!-- Central Track Grid -->
      <!-- Vertical path -->
      <rect x="80" y="20" width="40" height="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
      <path d="M 93.3,20 V 80 M 106.6,20 V 80 M 80,40 H 120 M 80,60 H 120" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" />
      <rect x="93.3" y="20" width="13.3" height="60" fill="rgba(16, 185, 129, 0.12)" />

      <rect x="80" y="120" width="40" height="60" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
      <path d="M 93.3,120 V 180 M 106.6,120 V 180 M 80,140 H 120 M 80,160 H 120" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" />
      <rect x="93.3" y="120" width="13.3" height="60" fill="rgba(37, 99, 235, 0.14)" />

      <!-- Horizontal path -->
      <rect x="20" y="80" width="60" height="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
      <path d="M 40,80 V 120 M 60,80 V 120 M 20,93.3 H 80 M 20,106.6 H 80" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" />
      <rect x="20" y="93.3" width="60" height="13.3" fill="rgba(239, 68, 68, 0.12)" />

      <rect x="120" y="80" width="60" height="40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="0.8" />
      <path d="M 140,80 V 120 M 160,80 V 120 M 120,93.3 H 180 M 120,106.6 H 180" stroke="rgba(255,255,255,0.05)" stroke-width="0.8" />
      <rect x="120" y="93.3" width="60" height="13.3" fill="rgba(234, 179, 8, 0.12)" />

      <!-- Center Triangle -->
      <polygon points="80,80 120,80 100,100" fill="rgba(16, 185, 129, 0.16)" />
      <polygon points="120,80 120,120 100,100" fill="rgba(234, 179, 8, 0.16)" />
      <polygon points="80,120 120,120 100,100" fill="rgba(37, 99, 235, 0.18)" />
      <polygon points="80,80 80,120 100,100" fill="rgba(239, 68, 68, 0.16)" />

      <!-- Star motifs -->
      <path d="M 30,90 l 1.5,3.5 3.5,0.5 -2.5,2.5 0.5,3.5 -3,-1.8 -3,1.8 0.5,-3.5 -2.5,-2.5 3.5,-0.5 z" fill="rgba(255,255,255,0.12)" />
      <path d="M 90,30 l 1.5,3.5 3.5,0.5 -2.5,2.5 0.5,3.5 -3,-1.8 -3,1.8 0.5,-3.5 -2.5,-2.5 3.5,-0.5 z" fill="rgba(255,255,255,0.12)" />
      <path d="M 170,110 l 1.5,3.5 3.5,0.5 -2.5,2.5 0.5,3.5 -3,-1.8 -3,1.8 0.5,-3.5 -2.5,-2.5 3.5,-0.5 z" fill="rgba(255,255,255,0.12)" />
      <path d="M 110,170 l 1.5,3.5 3.5,0.5 -2.5,2.5 0.5,3.5 -3,-1.8 -3,1.8 0.5,-3.5 -2.5,-2.5 3.5,-0.5 z" fill="rgba(255,255,255,0.12)" />
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#ludoTile)" />
</svg>
